name: APK WFQA officiel
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get && flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-android
          path: unsigned.apk
          retention-days: 1
  sign:
    needs: build
    permissions:
      contents: write
    uses: panlelapin/android/.github/workflows/sign-apk.yml@6299389f5cc44bd9a090bd68528e1d7f7ac27f3f
    secrets:
      apk_p12: ${{ secrets.ANDROID_RELEASE_P12_B64 }}
      apk_password: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
