name: Compiler macOS
on:
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build macos --release
      - name: Vérifier et archiver le bundle natif
        run: |
          app=build/macos/Build/Products/Release/wf_quick_add.app
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/wf_quick_add" -verify_arch arm64
          ditto -c -k --keepParent "$app" wf-quick-add-0.1-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wf-quick-add-macos
          path: wf-quick-add-0.1-macos.zip
